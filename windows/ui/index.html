<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/app-icons/Charkle-Light.svg" />
    <title>Charkle</title>
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('charkle.win.theme') || 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var effective = mode === 'dark' || (mode === 'system' && prefersDark) ? 'dark' : 'light';
          document.documentElement.dataset.theme = effective;
          document.documentElement.classList.toggle('dark', effective === 'dark');
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
