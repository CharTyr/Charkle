[package]
name = "charkle-android-ffi"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[lib]
name = "charkle_android_ffi"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
charkle-core = { path = "../../../windows/crates/charkle-core" }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uniffi = { version = "0.29", features = ["tokio", "cli"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"
