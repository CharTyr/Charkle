<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charkle</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Compact Studio Header -->
    <header class="topbar">
      <div class="brand-group">
        <picture class="brand-mark">
          <source media="(prefers-color-scheme: dark)" srcset="icons/charkle-dark.svg" />
          <img src="icons/charkle-light.svg" alt="Charkle" width="22" height="22" />
        </picture>
        <span class="brand-name">Charkle</span>
        <span id="conn-pill" class="conn-pill" data-state="idle" title="连接状态">
          <span class="conn-dot" aria-hidden="true"></span>
          <span id="conn-label" class="conn-label">未连接</span>
        </span>
      </div>
      <div class="topbar-actions">
        <button
          id="btn-open-web"
          type="button"
          class="icon-btn pressable"
          title="打开 Charkle Web"
          aria-label="打开 Charkle Web"
          hidden
        >
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6.5 3.5H3.8C3.08 3.5 2.5 4.08 2.5 4.8V12.2C2.5 12.92 3.08 13.5 3.8 13.5H11.2C11.92 13.5 12.5 12.92 12.5 12.2V9.5M9.5 2.5H13.5M13.5 2.5V6.5M13.5 2.5L7.5 8.5" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button
          id="btn-open-options"
          type="button"
          class="icon-btn pressable"
          title="扩展设置"
          aria-label="打开扩展设置"
        >
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.45" />
            <path d="M8 2.2V3.6M8 12.4V13.8M2.2 8H3.6M12.4 8H13.8M3.9 3.9L4.9 4.9M11.1 11.1L12.1 12.1M12.1 3.9L11.1 4.9M4.9 11.1L3.9 12.1" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </header>

    <!-- View A: Unconfigured Onboarding Card -->
    <main id="view-onboarding" class="content-area" hidden>
      <section class="surface-card onboarding-card">
        <div class="onboarding-head">
          <h1>连接 Charkle</h1>
        </div>

        <form id="onboarding-form" class="stack-md" novalidate>
          <div class="field-group">
            <label for="onboard-server">服务地址</label>
            <input
              id="onboard-server"
              type="url"
              class="input-control"
              placeholder="http://127.0.0.1:3417"
              autocomplete="url"
              required
            />
          </div>

          <div class="field-group">
            <label for="onboard-token">访问令牌</label>
            <div class="token-row">
              <input
                id="onboard-token"
                type="password"
                class="input-control"
                placeholder="粘贴访问令牌"
                autocomplete="off"
                spellcheck="false"
                required
              />
              <button
                id="btn-toggle-onboard-token"
                type="button"
                class="icon-btn-subtle pressable"
                aria-label="显示或隐藏令牌"
                title="显示/隐藏令牌"
              >
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path d="M1.8 8C3.1 5.3 5.3 4 8 4C10.7 4 12.9 5.3 14.2 8C12.9 10.7 10.7 12 8 12C5.3 12 3.1 10.7 1.8 8Z" stroke="currentColor" stroke-width="1.35" />
                  <circle cx="8" cy="8" r="1.8" stroke="currentColor" stroke-width="1.35" />
                </svg>
              </button>
            </div>
            <p class="field-hint">
              在 Charkle「设置 → 插件与扩展」生成访问令牌
            </p>
          </div>

          <p id="onboard-error" class="inline-error" role="alert" hidden></p>

          <button id="btn-onboard-save" type="submit" class="btn-primary pressable">
            测试并保存
          </button>
        </form>
      </section>
    </main>

    <!-- View B: Connected Compact Workbench -->
    <main id="view-workbench" class="content-area" hidden>
      <!-- Persistent Target Bar -->
      <section class="surface-card target-card" aria-label="收藏目标">
        <div class="target-header">
          <span class="section-label">收藏目标</span>
          <button
            id="btn-refresh-targets"
            type="button"
            class="ghost-mini-btn pressable"
            title="刷新文件夹与情绪板列表"
          >
            <svg id="icon-refresh-targets" width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M13.2 8A5.2 5.2 0 1 1 11.7 4.3M13.2 2.8V5.6H10.4" stroke="currentColor" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>同步</span>
          </button>
        </div>

        <div class="segmented-control" role="radiogroup" aria-label="收藏目标类型">
          <button type="button" class="seg-btn pressable" role="radio" data-target-mode="inbox" aria-checked="true">
            收件箱
          </button>
          <button type="button" class="seg-btn pressable" role="radio" data-target-mode="folder" aria-checked="false">
            指定文件夹
          </button>
          <button type="button" class="seg-btn pressable" role="radio" data-target-mode="board" aria-checked="false">
            当前情绪板
          </button>
        </div>

        <div id="target-folder-wrap" class="target-select-wrap" hidden>
          <select id="select-folder" class="select-control" aria-label="选择文件夹"></select>
        </div>
        <div id="target-board-wrap" class="target-select-wrap" hidden>
          <select id="select-board" class="select-control" aria-label="选择情绪板"></select>
        </div>
      </section>

      <!-- 4 Action Tabs -->
      <nav class="tab-bar" role="tablist" aria-label="剪藏模式">
        <button type="button" id="tab-page" class="tab-btn pressable" role="tab" aria-selected="true" aria-controls="panel-page" data-tab="page">
          网页与截屏
        </button>
        <button type="button" id="tab-images" class="tab-btn pressable" role="tab" aria-selected="false" aria-controls="panel-images" data-tab="images">
          批量抓图
        </button>
        <button type="button" id="tab-text" class="tab-btn pressable" role="tab" aria-selected="false" aria-controls="panel-text" data-tab="text">
          文字灵感
        </button>
        <button type="button" id="tab-color" class="tab-btn pressable" role="tab" aria-selected="false" aria-controls="panel-color" data-tab="color">
          色卡取色
        </button>
      </nav>

      <!-- Tab 1: Page & Visible Screenshot -->
      <section id="panel-page" class="tab-panel surface-card" role="tabpanel" aria-labelledby="tab-page">
        <div class="page-meta-row">
          <img id="page-favicon" class="page-favicon" src="" alt="" width="16" height="16" hidden />
          <span id="page-host" class="page-host">—</span>
          <span id="source-badge" class="source-badge" data-kind="web">网页书签</span>
        </div>

        <div class="stack-sm">
          <div class="field-group">
            <label for="page-title-input">标题</label>
            <input id="page-title-input" type="text" class="input-control" placeholder="网页标题" />
          </div>
          <div class="field-group">
            <label for="page-notes-input">备注（可选）</label>
            <textarea
              id="page-notes-input"
              class="textarea-control"
              rows="2"
              placeholder="添加备注…"
            ></textarea>
          </div>
        </div>

        <div id="screenshot-preview-wrap" class="screenshot-preview" hidden>
          <img id="screenshot-preview-img" alt="已截取画面预览" />
          <span class="screenshot-badge">已入库截屏</span>
        </div>

        <div class="action-row">
          <button id="btn-save-page" type="button" class="btn-primary pressable">
            收藏当前网页
          </button>
          <button id="btn-capture-visible" type="button" class="btn-secondary pressable" title="截取当前标签页可见画面并上传">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M2.5 5.2C2.5 4.4 3.1 3.8 3.9 3.8H5.2L6.1 2.5H9.9L10.8 3.8H12.1C12.9 3.8 13.5 4.4 13.5 5.2V11.8C13.5 12.6 12.9 13.2 12.1 13.2H3.9C3.1 13.2 2.5 12.6 2.5 11.8V5.2Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round" />
              <circle cx="8" cy="8.4" r="2.2" stroke="currentColor" stroke-width="1.35" />
            </svg>
            <span>截取可见画面</span>
          </button>
        </div>
      </section>

      <!-- Tab 2: Batch Image Grabber -->
      <section id="panel-images" class="tab-panel surface-card" role="tabpanel" aria-labelledby="tab-images" hidden>
        <div class="images-toolbar">
          <span id="images-summary" class="images-summary">正在扫描页面图片…</span>
          <div class="images-toolbar-actions">
            <button id="btn-select-large" type="button" class="ghost-mini-btn pressable">全选大图</button>
            <button id="btn-clear-images" type="button" class="ghost-mini-btn pressable">清空</button>
            <button id="btn-rescan-images" type="button" class="ghost-mini-btn pressable" title="重新扫描">重扫</button>
          </div>
        </div>

        <div id="images-empty" class="empty-state" hidden>
          <p id="images-empty-text">未发现图片</p>
        </div>

        <div id="images-grid" class="images-grid charkle-scroll" role="list"></div>

        <div class="images-footer">
          <button id="btn-save-images" type="button" class="btn-primary pressable" disabled>
            收藏所选 (0)
          </button>
        </div>
      </section>

      <!-- Tab 3: Text Snippet -->
      <section id="panel-text" class="tab-panel surface-card" role="tabpanel" aria-labelledby="tab-text" hidden>
        <div class="stack-sm">
          <div class="field-group">
            <label for="text-title-input">标题</label>
            <input id="text-title-input" type="text" class="input-control" placeholder="文字灵感标题" />
          </div>
          <div class="field-group">
            <div class="label-row">
              <label for="text-body-input">正文内容</label>
              <span id="text-char-count" class="char-count">0 字</span>
            </div>
            <textarea
              id="text-body-input"
              class="textarea-control textarea-tall"
              rows="5"
              placeholder="输入或粘贴文字内容…"
            ></textarea>
          </div>
          <label class="checkbox-row">
            <input id="text-include-source" type="checkbox" checked />
            <span id="text-source-label">附带当前网页来源链接</span>
          </label>
        </div>
        <button id="btn-save-text" type="button" class="btn-primary pressable">
          收藏文字灵感
        </button>
      </section>

      <!-- Tab 4: Color Swatch & EyeDropper -->
      <section id="panel-color" class="tab-panel surface-card" role="tabpanel" aria-labelledby="tab-color" hidden>
        <div id="color-swatch-stage" class="color-swatch-stage" style="background-color: #2A60E0;">
          <span id="color-swatch-hex" class="swatch-hex-display">#2A60E0</span>
        </div>

        <div class="color-picker-row">
          <button id="btn-eyedropper" type="button" class="btn-secondary pressable">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M11.6 2.4C12.3 1.7 13.4 1.7 14.1 2.4C14.8 3.1 14.8 4.2 14.1 4.9L11.7 7.3L12.5 8.1L11.5 9.1L10.3 7.9L5.5 12.7C5.1 13.1 4.6 13.3 4.1 13.3H2.6V11.8C2.6 11.3 2.8 10.8 3.2 10.4L8 5.6L6.8 4.4L7.8 3.4L8.6 4.2L11.6 2.4Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" />
            </svg>
            <span>屏幕取色</span>
          </button>

          <label class="native-color-wrap" title="颜色选择器">
            <input id="color-native-input" type="color" value="#2A60E0" aria-label="选择颜色" />
            <span id="color-native-dot" class="native-color-dot" style="background-color: #2A60E0;"></span>
          </label>

          <input
            id="color-hex-input"
            type="text"
            class="input-control hex-input"
            value="#2A60E0"
            maxlength="7"
            spellcheck="false"
            aria-label="HEX 色值"
            placeholder="#2A60E0"
          />
        </div>

        <div class="field-group">
          <label for="color-title-input">色卡名称（可选）</label>
          <input id="color-title-input" type="text" class="input-control" placeholder="色卡名称" />
        </div>

        <button id="btn-save-color" type="button" class="btn-primary pressable">
          收藏色卡
        </button>
      </section>

      <!-- Non-intrusive Status Bar -->
      <div id="status-banner" class="status-banner" role="status" aria-live="polite" hidden>
        <span id="status-banner-dot" class="status-banner-dot" aria-hidden="true"></span>
        <span id="status-banner-text" class="status-banner-text"></span>
      </div>
    </main>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
